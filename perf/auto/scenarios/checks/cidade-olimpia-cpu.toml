name = "cidade-olimpia-cpu"
description = "City of Olympia (Load list row 22), walked to the plaza of the comparison screenshot by a recorded route, then camera still. 1080p with the CPU sampler (SPARTAN_CPU_SAMPLER): where every thread spends its time; perf/auto/cpu_profile.py reads cpu_samples.tsv. The sampler slows the game a little: not for FPS comparisons."
start = "load"
route = "../cidade-olimpia.pad"
load_index = 22
expect_save = "SD-261110045516"
settle_s = 15
duration_s = 60
min_draws = 600
capture = false  # the plaza's enemies move: the frame structure differs between runs
timeout_s = 480

[ini]
render_resolution = "native"

[env]
SPARTAN_CPU_SAMPLER = 1
SPARTAN_CPU_SAMPLER_DELAY_S = 100
SPARTAN_STAGE_PROFILE = 1
