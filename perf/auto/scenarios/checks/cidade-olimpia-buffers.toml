name = "cidade-olimpia-buffers"
description = "City of Olympia (Load list row 22), walked to the plaza of the comparison screenshot by a recorded route, then camera still. 1080p with buffer binding stats (SPARTAN_BUFFER_STATS=1) and the stage B profile: how many vertex and index streams are small copies."
start = "load"
route = "../cidade-olimpia.pad"
load_index = 22
expect_save = "SD-261110045516"
settle_s = 15
duration_s = 60
min_draws = 600
capture = false  # the plaza's enemies move: the frame structure differs between runs
timeout_s = 480

[ini]
render_resolution = "native"

[env]
SPARTAN_STAGE_PROFILE = 1
SPARTAN_BUFFER_STATS = 1
