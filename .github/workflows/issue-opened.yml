# New issue: turns the form's Category and Operating system/Platform answers into labels and, for
# bugs, asks for a retest when the port version is older than the previous minor line of the newest
# stable release. Logic and tests in .github/scripts/issue-triage.js.
name: Issue opened

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/issue-triage.js').onOpened({ github, context, core })
