# Linux AppImage: built on Ubuntu 24.04 so it starts on glibc 2.39 or newer (SteamOS, Bazzite/Fedora,
# Debian 13, Ubuntu 24.04+; #291), then opened on those distros before it is published. Run by hand
# (Actions > Linux AppImage > Run workflow), on the branch to build:
#   - no tag: build and test only (the AppImage is kept as a workflow artifact).
#   - tag of an existing release (e.g. windows-v2.2.0): the AppImage replaces the one attached to it.
#   - new tag (e.g. linux-v2.2.1-test1): test build, published as a pre-release on that commit.
name: Linux AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the AppImage to; a new tag makes a test pre-release. Empty builds only.
        required: false
      stamp:
        description: Attach the release stamp
        type: boolean
        default: true
      graphics_only:
        description: Run only the isolated graphics diagnostics
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linux-appimage-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.graphics_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: bash packaging/linux/ci-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          SDL_AUDIO_DRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}"
          timeout 45m bash build.sh --test
      - name: Stamp
        if: inputs.tag != '' && inputs.stamp
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if pre=$(gh release view "$TAG" --json isPrerelease -q .isPrerelease 2>gh.err); then :
          elif grep -qi 'not found' gh.err; then pre=true
          else cat gh.err >&2; echo "::error::gh release view failed for $TAG"; exit 1
          fi
          python3 packaging/release_stamp.py "$TAG" --prerelease "$pre" > release.json
          mkdir -p dist && cp release.json dist/release-linux.json
          cat release.json
      - name: AppImage
        id: package
        if: ${{ !cancelled() }}
        run: |
          bash packaging/linux/build.sh
          cd dist && sha256sum spartanport-x86_64.AppImage | sed 's/  / */' > spartanport-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: spartanport-x86_64.AppImage
          path: |
            dist/spartanport-x86_64.AppImage*
            dist/release-linux.json
          if-no-files-found: error

  smoke:
    needs: build
    if: ${{ !cancelled() && !inputs.graphics_only }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # debian:13 has SteamOS 3.7's glibc (2.41), fedora:42 is Bazzite's base.
        image: ['debian:13', 'fedora:42', 'ubuntu:24.04', 'archlinux:latest',
                'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spartanport-x86_64.AppImage
          path: dist
      - name: Open the launcher on ${{ matrix.image }}
        env:
          SPARTAN_RELEASE_TAG: ${{ inputs.stamp && inputs.tag || '' }}
        run: |
          chmod +x dist/spartanport-x86_64.AppImage
          docker run --rm -e SPARTAN_RELEASE_TAG -v "$PWD:/w:ro" "${{ matrix.image }}" bash /w/packaging/linux/smoke-test.sh /w/dist/spartanport-x86_64.AppImage

  graphics-baseline:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [lto, no-lto, sanitizers]
        revision: [main-96debe8, pr792-integration]
        include:
          - revision: main-96debe8
            ref: 96debe8fac86c518990b20deb3df77eead1844fa
          - revision: pr792-integration
            ref: ${{ github.sha }}
    name: Graphics baseline (${{ matrix.revision }}, ${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Install the matching compiler and debugger
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-14 gdb
      - name: Compile and diagnose the standalone graphics test
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/graphics-ci"
          flags=(-std=gnu++23 -O2 -g -DNDEBUG -fPIC -fno-omit-frame-pointer -UNDEBUG)
          case "$MODE" in
            lto) flags+=(-flto=auto -fno-fat-lto-objects) ;;
            sanitizers) flags+=(-fsanitize=address,undefined) ;;
          esac
          g++-14 --version | tee "$RUNNER_TEMP/graphics-ci/compiler.log"
          g++-14 "${flags[@]}" -Igpu/shim tests/test_graphics_settings.cpp \
            gpu/shim/spartanport_settings.cpp -o "$RUNNER_TEMP/graphics-ci/graphics-settings-test"
          for attempt in 1 2 3; do
            status=0
            timeout 30 "$RUNNER_TEMP/graphics-ci/graphics-settings-test" \
              > "$RUNNER_TEMP/graphics-ci/run-$attempt.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/graphics-ci/run-$attempt.log"
            if [[ $status != 0 ]]; then
              timeout 45 gdb --batch -ex run -ex 'bt full' -ex 'info registers' -ex 'x/12i $pc-24' \
                --args "$RUNNER_TEMP/graphics-ci/graphics-settings-test" \
                > "$RUNNER_TEMP/graphics-ci/backtrace.log" 2>&1 || true
              cat "$RUNNER_TEMP/graphics-ci/backtrace.log"
              exit "$status"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: graphics-${{ matrix.revision }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/graphics-ci/*.log

  publish:
    needs: smoke
    if: inputs.tag != '' && !inputs.graphics_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spartanport-x86_64.AppImage
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Linux test build $TAG" \
              --notes "Linux test build from \`${GITHUB_SHA::7}\`. Download \`spartanport-x86_64.AppImage\`, then \`chmod +x spartanport-x86_64.AppImage\` and run it. Not a final release: please report in the linked issue whether it opens and runs."
          fi
          gh release upload "$TAG" dist/spartanport-x86_64.AppImage dist/spartanport-x86_64.AppImage.sha256 $( [[ -f dist/release-linux.json ]] && echo dist/release-linux.json ) --clobber
