name: PR1070 Linux package validation

on:
  push:
    branches: [validation/pr1070-linux-final]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr1070-linux-final
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify identical validated inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code 0419b80e2665362a6f33696ea1758d23f3882e66 HEAD -- src gpu launcher-rust launcher run.py build.sh tests packaging
          git diff --exit-code 58f9b5eea3019de433f2d3d47d5f09b323eb7bdc HEAD -- gpu ':(glob)src/**/*.h'
          git diff --exit-code b8abfdd68b687fdd636918ea93aa4cd377620864 HEAD -- launcher-rust launcher scripts patches
          python3 - <<'PY'
          import json, subprocess
          for run, head in [(40349615986, '58f9b5eea3019de433f2d3d47d5f09b323eb7bdc'), (40223880591, 'b8abfdd68b687fdd636918ea93aa4cd377620864')]:
              result = json.loads(subprocess.check_output(['gh', 'api', f'repos/FelipePrado0/SpartanPort/actions/runs/{run}']))
              assert result['conclusion'] == 'success' and result['head_sha'] == head
          PY
      - uses: actions/download-artifact@v4
        with:
          name: build-pr1009-ubuntu-24.04
          run-id: 40349615986
          github-token: ${{ github.token }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: spartanport-launcher-ubuntu-24.04
          run-id: 40223880591
          github-token: ${{ github.token }}
          path: launcher-rust/target/release
      - name: Use the official Ubuntu HTTPS mirror
        run: sudo python3 tools/validation/ubuntu-mirror.py
      - name: Install runtime and packaging dependencies
        timeout-minutes: 10
        run: |
          nproc
          free -h
          ninja() { command ninja -j"$(nproc)" "$@"; }
          export -f ninja
          bash packaging/linux/ci-deps.sh
      - name: Recompile production runtime and check startup
        timeout-minutes: 5
        run: bash tools/validation/linux-runtime-reuse.sh 2>&1 | tee out/validation/runtime-build.log
      - name: Package with the verified Rust launcher and GPU
        timeout-minutes: 5
        run: |
          chmod +x launcher-rust/target/release/spartanport-launcher
          CARGO=/usr/bin/true bash packaging/linux/build.sh 2>&1 | tee out/validation/appimage-build.log
          sha256sum dist/spartanport-x86_64.AppImage | tee out/validation/appimage.sha256
      - name: Open the actual AppImage on a virtual display
        timeout-minutes: 4
        run: sudo timeout --kill-after=10s 180 bash packaging/linux/smoke-test.sh "$PWD/dist/spartanport-x86_64.AppImage" 2>&1 | tee out/validation/appimage-startup.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1070-linux-final
          path: |
            out/validation
            dist/*.AppImage
