name: Isolated native PR validation

on:
  push:
    branches: [validation/prs-1009-1070-1007]
    paths:
      - '.github/workflows/pr-native-validation.yml'
      - 'tools/validation/**'
      - 'tests/test_savedata.c'
  workflow_dispatch:
    inputs:
      baseline:
        description: Main commit used as the comparison baseline
        required: true
      pr:
        description: Pull request under validation
        required: true
      phase:
        description: Stages to execute
        type: choice
        options: [all, build-linux]
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: isolated-pr-validation
  cancel-in-progress: false

env:
  VALIDATION_BASELINE: ${{ inputs.baseline || '9e6c7260a7bf9d80c0ed0748b9efc00e760178b4' }}
  VALIDATION_PR: ${{ inputs.pr || '1007' }}
  TZ: UTC

jobs:
  native:
    if: ${{ inputs.phase != 'build-linux' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep source line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          release: false
          update: true
          install: git
          pacboy: toolchain:p
      - name: Native contracts on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/validation/native-contracts.sh "$VALIDATION_BASELINE" "$VALIDATION_PR"
      - name: Native contracts on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash tools/validation/native-contracts.sh "$VALIDATION_BASELINE" "$VALIDATION_PR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pr${{ env.VALIDATION_PR }}-${{ matrix.os }}
          path: out/validation/*.log
          if-no-files-found: warn

  rust:
    needs: native
    if: ${{ inputs.phase != 'build-linux' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: launcher-rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reusable Rust evidence
        if: env.VALIDATION_PR == '1070'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import json, subprocess; r=json.loads(subprocess.check_output(['gh','api','repos/FelipePrado0/SpartanPort/actions/runs/40223880591'])); assert r['conclusion']=='success' and r['head_sha']=='b8abfdd68b687fdd636918ea93aa4cd377620864'"
          git diff --exit-code b8abfdd68b687fdd636918ea93aa4cd377620864 HEAD -- launcher-rust launcher scripts patches
      - uses: actions/download-artifact@v4
        if: env.VALIDATION_PR == '1070'
        with:
          name: spartanport-launcher-${{ matrix.os }}
          run-id: 40223880591
          github-token: ${{ github.token }}
          path: launcher-rust/target/release
      - uses: dtolnay/rust-toolchain@stable
        if: env.VALIDATION_PR != '1070'
        with:
          components: clippy, rustfmt
      - name: Linux launcher libraries
        if: runner.os == 'Linux' && env.VALIDATION_PR != '1070'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
        if: env.VALIDATION_PR != '1070'
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: env.VALIDATION_PR != '1070'
      - run: cargo test --locked
        if: env.VALIDATION_PR != '1070'
      - run: cargo build --release --locked
        if: env.VALIDATION_PR != '1070'
      - uses: actions/upload-artifact@v4
        with:
          name: rust-pr${{ env.VALIDATION_PR }}-${{ matrix.os }}
          path: launcher-rust/target/release/spartanport-launcher*

  build:
    needs: rust
    if: ${{ always() && (needs.rust.result == 'success' || inputs.phase == 'build-linux') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.phase == 'build-linux' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      SPARTAN_LTO: 'OFF'
      SPARTAN_PGO: 'off'
    steps:
      - name: Keep source line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          release: false
          update: true
          install: git patch
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux' && env.VALIDATION_PR == '1070'
        with:
          name: rust-pr1070-ubuntu-24.04
          path: launcher-rust/target/release
      - name: Linux runtime dependencies and build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/linux/ci-deps.sh
          bash build.sh
          ninja -C out/gpu graphics-settings-test
          timeout 60 out/gpu/graphics-settings-test
          export XDG_DATA_HOME="$RUNNER_TEMP/spartanport-xdg"
          mkdir -p "$XDG_DATA_HOME"
          timeout 30 out/spartanport-probe --cpu-features
          if [[ "$VALIDATION_PR" == 1070 ]]; then
            chmod +x launcher-rust/target/release/spartanport-launcher
            CARGO=/usr/bin/true bash packaging/linux/build.sh
            sudo bash packaging/linux/smoke-test.sh "$PWD/dist/spartanport-x86_64.AppImage"
          fi
      - name: Windows runtime build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          bash build.sh --test
          timeout 30 out/spartanport-probe.exe --cpu-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-pr${{ env.VALIDATION_PR }}-${{ matrix.os }}
          path: |
            out/gpu-build.log
            out/spartanport-probe*
            out/gpu/libspartanportgpu.so
            dist/*.AppImage
