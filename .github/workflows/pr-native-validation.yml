name: Isolated native PR validation

on:
  push:
    branches: [validation/prs-1009-1070-1007]
    paths:
      - '.github/workflows/pr-native-validation.yml'
      - 'tools/validation/**'
      - 'tests/test_savedata.c'
  workflow_dispatch:
    inputs:
      baseline:
        description: Main commit used as the comparison baseline
        required: true
      pr:
        description: Pull request under validation
        required: true
      phase:
        description: Stages to execute
        type: choice
        options: [all, build-linux]
        default: build-linux

permissions:
  contents: read

concurrency:
  group: isolated-pr-validation
  cancel-in-progress: false

env:
  VALIDATION_BASELINE: ${{ inputs.baseline || 'ec468cdb1c950ff0d811ee5d39293b449af5ca22' }}
  VALIDATION_PR: ${{ inputs.pr || '1009' }}
  CMAKE_BUILD_PARALLEL_LEVEL: '1'
  CARGO_BUILD_JOBS: '1'
  MAKEFLAGS: '-j1'
  RAYON_NUM_THREADS: '1'
  TZ: UTC

jobs:
  native:
    if: ${{ inputs.phase == 'all' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep source line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          release: false
          update: true
          install: git
          pacboy: toolchain:p
      - name: Native contracts on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/validation/native-contracts.sh "$VALIDATION_BASELINE" "$VALIDATION_PR"
      - name: Native contracts on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash tools/validation/native-contracts.sh "$VALIDATION_BASELINE" "$VALIDATION_PR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pr${{ env.VALIDATION_PR }}-${{ matrix.os }}
          path: out/validation/*.log
          if-no-files-found: warn

  rust:
    needs: native
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: launcher-rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux launcher libraries
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rust-pr${{ env.VALIDATION_PR }}-${{ matrix.os }}
          path: launcher-rust/target/release/spartanport-launcher*

  build:
    needs: rust
    if: ${{ always() && (needs.rust.result == 'success' || inputs.phase != 'all') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: ${{ inputs.phase == 'all' && fromJSON('["ubuntu-24.04", "windows-2025"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      SPARTAN_LTO: 'OFF'
      SPARTAN_PGO: 'off'
    steps:
      - name: Keep source line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          release: false
          update: true
          install: git patch
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p python:p
            vulkan-headers:p vulkan-loader:p vulkan-memory-allocator:p glslang:p
            sdl3:p fmt:p boost:p robin-map:p xxhash:p ffmpeg:p zydis:p
            spirv-tools:p spirv-headers:p spirv-cross:p
      - name: Linux runtime dependencies and build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/validation/serial-build.sh
          bash packaging/linux/ci-deps.sh
          bash build.sh
          ninja -C out/gpu graphics-settings-test
          timeout 60 out/gpu/graphics-settings-test
          export XDG_DATA_HOME="$RUNNER_TEMP/spartanport-xdg"
          mkdir -p "$XDG_DATA_HOME"
          timeout 30 out/spartanport-probe --cpu-features
      - name: Windows runtime build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          source tools/validation/serial-build.sh
          bash build.sh --test
          timeout 30 out/spartanport-probe.exe --cpu-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-pr${{ env.VALIDATION_PR }}-${{ matrix.os }}
          path: |
            out/gpu-build.log
            out/spartanport-probe*
            out/gpu/libspartanportgpu.so
