name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/windows/installer/**'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [gow3, main]
    paths:
      - 'packaging/windows/installer/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile and run installer tests
        shell: powershell
        run: ./packaging/windows/installer/build.ps1 -Test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gow3-windows-installer
          path: |
            dist/installer/God-of-War-III-Setup.exe
            dist/installer/God-of-War-III-Setup.exe.sha256
            dist/installer/preview.*.png
          if-no-files-found: error
