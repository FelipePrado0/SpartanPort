name: Feature request
description: Suggest something that isn't a bug, e.g. new platform support, settings, QoL
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do that you can't right now?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional, if you have something specific in mind.
    validations:
      required: false
